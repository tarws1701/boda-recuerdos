<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comparte tus recuerdos</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <section class="hero">

            <p class="eyebrow">NUESTRA BODA</p>

            <h1>
                Wilmer <span>&</span> Shadai
            </h1>

            <p class="date">
                10 · 10 · 2026
            </p>

            <div class="divider"></div>

            <h2>
                Comparte tus recuerdos
            </h2>

            <p class="description">
                ¿Tomaste una foto o un video especial?
                Compártelo con nosotros y ayúdanos a guardar
                cada momento de este día.
            </p>

            <div class="upload-box">

                <div class="upload-icon">
                    📸
                </div>

                <h3>
                    Sube tus fotos y videos
                </h3>

                <p>
                    No necesitas registrarte.
                </p>

                <input
                    type="file"
                    id="fileInput"
                    accept="image/*,video/*"
                    multiple
                >

                <label for="fileInput" class="upload-button">
                    Seleccionar archivos
                </label>

            </div>

            <div id="fileList" class="file-list"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
