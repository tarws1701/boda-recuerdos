<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wilmer & Shadai | Comparte tus recuerdos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <section class="hero">

            <div class="decor decor-one">✦</div>
            <div class="decor decor-two">♡</div>

            <p class="eyebrow">NUESTRA BODA</p>

            <h1>
                Wilmer <span>&</span> Shadai
            </h1>

            <p class="date">
                17 · 10 · 2026
            </p>

            <div class="divider">
                <span>♡</span>
            </div>

            <h2>
                Comparte tus recuerdos
            </h2>

            <p class="description">
                ¿Tomaste una foto o un video especial?
                Compártelo con nosotros y ayúdanos a guardar
                cada momento de este día.
            </p>

            <div class="upload-box">

                <div class="upload-icon">
                    📸
                </div>

                <h3>
                    Guarda este momento con nosotros
                </h3>

                <p class="upload-info">
                    Selecciona tus fotos y videos.<br>
                </p>

                <input
                    type="file"
                    id="fileInput"
                    accept="image/*,video/*"
                    multiple
                >

                <label for="fileInput" class="upload-button">
                    Seleccionar recuerdos
                </label>

            </div>

            <div id="fileList" class="file-list"></div>

            <button id="uploadButton" class="upload-submit" disabled>
                💕 Subir mis recuerdos
            </button>

            <div id="statusMessage" class="status-message"></div>

            <p class="footer-text">
                Gracias por ser parte de nuestro día ♡
            </p>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
